_target_: cs336_basics.models.ModularTransformerLM
_recursive_: false

vocab_size: ${data.vocab_size}

d_model: 512
num_layers: 4
context_length: ${data.context_length}

embedding:
  _target_: cs336_basics.models.Embedding
  num_embeddings: ${model.vocab_size} 
  embedding_dim: ${model.d_model}

block:
  _target_: cs336_basics.models.ModularTransformerBlock

  pre_norm: true

  norm: 
    _target_: cs336_basics.models.RMSNorm
    eps: 1e-6
    d_model: ${model.d_model}
  
  ffn: 
    _target_: cs336_basics.models.PositionWiseFFN
    d_model: ${model.d_model}
    d_ff: 1344
  
  attn: 
    _target_: cs336_basics.models.CausalMultiHeadAttention
    d_model: ${model.d_model}
    num_heads: 8
    use_rope: true
    theta: 10000.0
    max_seq_len: ${model.context_length}

final_norm: 
  _target_: cs336_basics.models.RMSNorm
  eps: 1e-6
  d_model: ${model.d_model}

head: 
  _target_: cs336_basics.models.Linear
  in_features: ${model.d_model}
  out_features: ${model.vocab_size}